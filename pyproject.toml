[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "textinsight"
dynamic = ["version"]
description = "Lightweight, offline-first NLP for English and Hinglish text, with pluggable backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Harsh Vardhan Ajmera" }]
keywords = ["nlp", "sentiment", "hinglish", "code-mixed", "keywords", "summarization", "text-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Runtime dependencies are added in the phase that first uses them
# (numpy / scikit-learn / regex arrive with preprocessing and sentiment).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
# Update these once the GitHub repository exists.
Homepage = "https://github.com/YOUR-USERNAME/textinsight"
Issues = "https://github.com/YOUR-USERNAME/textinsight/issues"

[tool.hatch.version]
path = "src/textinsight/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/textinsight"]

[tool.hatch.build.targets.sdist]
include = ["src/textinsight", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=textinsight --cov-report=term-missing"
markers = [
    "slow: tests that load real models or hit the network (deselect with -m 'not slow')",
]

[tool.coverage.run]
branch = true
source = ["textinsight"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["textinsight"]
strict = true
warn_unreachable = true
